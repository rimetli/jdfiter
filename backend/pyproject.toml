[project]
name = "resume-screening-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.37,<3",
  "asyncmy>=0.2.10,<1",
  "alembic>=1.14,<2",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "pypdf>=5.1,<7",
  "pymupdf>=1.25,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["storage*", "migrations*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "DTZ003"]
